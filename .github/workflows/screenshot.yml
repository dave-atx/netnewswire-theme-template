name: Refresh marketplace screenshot

on:
  workflow_dispatch:
    inputs:
      fixture:
        description: Fixture to capture
        type: choice
        options: [article, kitchen-sink]
        default: article
      appearance:
        description: Appearance to capture
        type: choice
        options: [light, dark]
        default: light

permissions:
  contents: write
  pull-requests: write

jobs:
  screenshot:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - run: uv sync --locked
      - name: Install pinned Playwright CLI and WebKit
        run: |
          npm install --global @playwright/cli@0.1.20
          playwright-cli install-browser webkit
      - name: Capture and promote the deliberate 16:10 image
        run: >-
          uv run nnw-theme screenshot
          --fixture "${{ inputs.fixture }}"
          --platform mac
          --appearance "${{ inputs.appearance }}"
          --promote
      - name: Open a review pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: theme-preview-${{ github.run_id }}
        run: |
          git switch -c "$BRANCH"
          git add screenshots/theme-preview.png
          if git diff --cached --quiet; then
            echo "The promoted screenshot is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh theme preview screenshot"
          git push --set-upstream origin "$BRANCH"
          gh pr create --base "${{ github.event.repository.default_branch }}" \
            --head "$BRANCH" --title "Refresh theme preview screenshot" \
            --body "Generated on macOS WebKit for deliberate visual review."

