name: Publish preview pages

on:
  workflow_run:
    workflows: [Theme checks]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.head_repository.full_name == github.repository
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - run: uv sync --locked
      - name: Install pinned Playwright CLI and WebKit
        run: |
          npm install --global @playwright/cli@0.1.20
          playwright-cli install-browser webkit --with-deps
      - name: Initialize the untouched template for its own preview
        if: ${{ hashFiles('.nnw-theme-uninitialized') != '' }}
        run: >-
          uv run nnw-theme init
          --name "Neutral Reader"
          --creator "Template Maintainer"
          --homepage "https://github.com/dave-atx/netnewswire-theme-template"
          --identifier "io.github.dave-atx.neutral-reader"
          --confirm-identifier "io.github.dave-atx.neutral-reader"
          --marketplace no
          --no-install-browser
      - run: uv run nnw-theme check
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build/preview
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
